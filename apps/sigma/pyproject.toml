[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigma-analytics"
version = "1.0.0"
description = "SIGMA - Strategic Intelligence Graph-based Multi-Agent Analytics (LangGraph platform)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
  "langgraph>=1.2.19,<2",
  "langgraph-checkpoint-sqlite>=3.1.3,<4",
  "langgraph-prebuilt>=1.1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
sigma = "sigma.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
