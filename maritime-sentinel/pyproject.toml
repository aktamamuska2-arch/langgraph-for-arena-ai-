[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maritime-sentinel"
version = "1.0.0"
description = "Autonomous macro-dynamic stress-testing engine for regional maritime supply-chain disruption"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AM-SES v2.0" }]
keywords = ["simulation", "simpy", "langgraph", "maritime", "monte-carlo", "resilience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Simulation",
]
dependencies = [
    "langgraph>=1.0.0,<2",
    "pydantic>=2.7.4,<3",
    "numpy>=1.26,<3",
    "networkx>=3.2,<4",
    "simpy>=4.1,<5",
    "pandas>=2.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
maritime-build = "scripts.run_workflow:main"
maritime-mc = "scripts.run_montecarlo:main"

[tool.hatch.build.targets.wheel]
packages = ["maritime_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
